name: Deploy Frontend to Staging (Vercel)

on:
  push:
    branches:
      - stg
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Vercel Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://stg-flood-management.vercel.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: stg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint || true

      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GATEWAY_URL: https://flood-stg.157-245-102-69.sslip.io
          NEXT_PUBLIC_API_URL: https://flood-stg.157-245-102-69.sslip.io/api
          NEXT_PUBLIC_WS_URL: https://flood-stg.157-245-102-69.sslip.io
          NEXT_PUBLIC_ENVIRONMENT: staging
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: web
          vercel-args: "--prod"
          alias-domains: stg-flood-management.vercel.app

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Frontend deployment to Staging completed successfully!"
            echo "📍 URL: https://stg-flood-management.vercel.app"
            echo "🔍 Commit: ${{ github.sha }}"
            echo "👤 Author: ${{ github.actor }}"
          else
            echo "❌ Frontend deployment failed!"
            exit 1
          fi
